<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('theme'); } catch (e) { theme = null; }
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="마크다운으로 쓰는 개인 블로그">
  <title>My Blog</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="#/">My Blog</a>
      <button class="theme-toggle" type="button" aria-label="다크 모드로 전환">☾</button>
    </div>
  </header>

  <main id="app" class="container" tabindex="-1">
    <p class="status">불러오는 중…</p>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> My Blog</p>
    </div>
  </footer>
</body>
</html>
